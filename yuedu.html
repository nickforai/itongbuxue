<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="阅读">
  <meta name="format-detection" content="telephone=no">
  <title>阅读 · i同步学</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=80">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">←</a>
      <h1>📖 阅读</h1>
    </div>

    <div class="tab-bar">
      <a href="yuwen.html">📜 古诗</a>
      <a href="shengzi.html">🖊️ 生字</a>
      <a class="on" href="yuedu.html">📖 阅读</a>
    </div>

    <div class="topic-chips" id="rdGrades"></div>

    <section id="rdList">
      <div class="panel" style="padding:14px 18px;color:var(--muted);font-size:.9rem">
        选一篇读一读：先听示范，再点「开始阅读」大声朗读，读错的字会标红，最后按准确率得星星（规则同古诗）。
      </div>
      <div id="rdListBox"></div>
    </section>

    <section id="rdDetail" class="hidden">
      <div class="panel">
        <h2 id="rdTitle"></h2>
        <div class="rd-text" id="rdText"></div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn btn-green" id="rdPlay">🔊 播放全文</button>
          <button class="btn btn-blue" id="rdRec">🎤 开始阅读</button>
        </div>
      </div>
      <div class="panel">
        <div class="recite-live" id="rdLive"></div>
        <div class="recite-result hidden" id="rdResult"></div>
      </div>
    </section>
  </div>

  <script src="js/common.js?v=80"></script>
  <script src="js/data-reading.js?v=33"></script>
  <script src="js/yuedu.js?v=33"></script>
