<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="语文古诗">
  <meta name="format-detection" content="telephone=no">
  <title>语文古诗 · i同步学</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=81">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">←</a>
      <h1>📖 语文 · 古诗</h1>
      <div class="star-pill" data-star-key="yuwen">⭐ 0</div>
    </div>

    <div class="tab-bar">
      <a class="on" href="yuwen.html">📜 古诗</a>
      <a href="shengzi.html">🖊️ 生字</a>
      <a href="yuedu.html">📖 阅读</a>
    </div>

    <div class="topic-chips" id="poemGrades"></div>

    <section id="listScreen">
      <div class="panel" style="padding:14px 18px;color:var(--muted);font-size:.92rem">
        🎵 点一首诗，跟着朗读学一学；会背了按「我会背了」，每天每首可拿 1 颗星。
      </div>
      <div id="poemList"></div>
    </section>

    <section id="detailScreen" class="hidden">
      <div class="panel">
        <div class="poem-head">
          <h2 id="poemTitle"></h2>
          <div class="poem-author" id="poemAuthor"></div>
        </div>
        <div class="poem-text" id="poemLines"></div>
        <div class="poem-actions">
          <button class="btn btn-red" id="readBtn">🔊 听一听</button>
          <button class="btn btn-blue" id="recBtn">🎤 开始背诵</button>
        </div>
      </div>
      <div class="panel">
        <h2>🎤 录音背诵评分</h2>
        <p style="color:var(--muted);font-size:.85rem;line-height:1.7;margin-bottom:10px">
          点「开始背诵」后原文会遮住，凭记忆大声背出这首诗，系统自动识别并评分：<br>
          ≥60% 得 1 颗星 · ≥80% 得 2 颗星 · ≥90% 得 3 颗星（低于 60% 不得星）
        </p>
        <div class="recite-live" id="recLive"></div>
        <div class="recite-result hidden" id="recResult"></div>
      </div>
      <div class="poem-nav">
        <button class="btn btn-ghost" id="prevBtn">◀ 上一首</button>
        <button class="btn btn-ghost" id="nextBtn">下一首 ▶</button>
      </div>
    </section>
  </div>

  <script src="js/common.js?v=81"></script>
  <script src="js/data.js?v=33"></script>
  <script src="js/yuwen.js?v=81"></script>
</body>
</html>
