<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="美食大厨">
  <meta name="format-detection" content="telephone=no">
  <title>美食大厨 · i同步学</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=81">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">←</a>
      <h1>🍳 美食大厨</h1>
      <div class="star-pill" id="chefStarPill">⭐ 0</div>
    </div>

    <!-- 商店选择 -->
    <div class="panel" id="storePanel">
      <h2>🏪 选择商店</h2>
      <p class="muted-note" style="margin-bottom:12px">每家店都有 100 多关，通过 <b>15 关</b> 解锁下一家：汤包店 → 牛排店 → 汉堡店。店越高级，每道菜的分越高！</p>
      <div id="storeList"></div>
    </div>

    <!-- 店主页：开始做菜 / 升级厨房 -->
    <div class="panel hidden" id="storeHome">
      <h2 id="storeTitle"></h2>
      <div class="chef-store-home">
        <div class="chef-pts" id="storePts">💰 0 分</div>
        <div class="muted-note" id="storeProgress" style="margin:8px 0 14px"></div>
        <div class="btn-row">
          <button class="btn btn-gold" id="startCookBtn">🍳 开始做菜</button>
        </div>
      </div>
    </div>

    <!-- 做菜中 -->
    <div class="panel hidden" id="gamePanel">
      <div class="quiz-head">
        <span id="lvLabel">第 1 关</span>
        <span id="scoreLabel">0 分</span>
      </div>
      <div class="chef-order" id="orderBox">
        <div class="chef-customer-card">
          <div class="chef-customer" id="customerFace"></div>
          <div class="chef-customer-name" id="customerName">乐乐</div>
        </div>
        <div class="chef-order-card">
          <div class="chef-order-title">🧾 客人点了</div>
          <div class="chef-order-list" id="orderList"></div>
        </div>
        <div class="chef-timer"><div class="chef-timer-fill" id="timerFill"></div></div>
      </div>

      <div class="chef-tray-title">🍽️ 出餐台（做好后点一下端给客人）</div>
      <div class="chef-tray" id="tray"></div>

      <div class="chef-stove">
        <div class="chef-stove-label">👨‍🍳 做饭的台（点食材开始做）</div>
        <div class="chef-items" id="itemBtns"></div>
      </div>
      <div class="chef-lives" id="livesBox"></div>
      <div class="chef-feedback" id="chefFeedback"></div>
    </div>

    <!-- 过关结果 -->
    <div class="panel hidden" id="resultPanel">
      <div class="result-box">
        <div class="result-emoji" id="chefResultEmoji"></div>
        <div class="result-score" id="chefResultTitle"></div>
        <div class="result-line" id="chefResultLine"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="chefRetryBtn">再玩一次</button>
        <button class="btn btn-gold" id="chefNextBtn">下一关 ▶</button>
      </div>
      <button class="btn btn-blue" id="chefBackBtn" style="display:block;margin-top:12px">🏪 回商店</button>
    </div>

    <!-- 解锁新店 -->
    <div class="panel hidden" id="unlockPanel">
      <div class="result-box">
        <div class="result-emoji" id="unlockEmoji">🔓</div>
        <div class="result-score" id="unlockTitle">解锁新店！</div>
        <div class="result-line" id="unlockLine"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-blue" id="unlockGoBtn">去新店看看 ▶</button>
        <button class="btn btn-ghost" id="unlockStayBtn">留在本店</button>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=81"></script>
  <script src="js/foodchef.js?v=81"></script>
</body>
</html>
