<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="贪吃蛇">
  <meta name="format-detection" content="telephone=no">
  <title>贪吃蛇 · 学习乐园</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=65">
</head>
<body class="snake-body">
  <div class="page snake-page">
    <div class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">←</a>
      <h1>🐍 贪吃蛇</h1>
      <div class="star-pill" id="snChancePill">🐍 0</div>
      <div class="star-pill" id="snJifenPill">⭐ 0</div>
    </div>

    <!-- 大厅 -->
    <section id="snLobby">
      <div class="sn-panel">
        <h2>🐍 贪吃蛇</h2>
        <p style="color:var(--muted);font-size:.92rem;line-height:1.7;margin-bottom:14px">
          滑动或按方向键控制小蛇，吃掉红苹果长长长，<b>5 颗星星 = 1 次机会</b>。撞墙或咬到自己就结束啦！
        </p>
        <div class="stat-grid" style="margin-bottom:16px">
          <div class="stat-cell"><div class="sv" id="snJifen">0</div><div class="sl">⭐ 星星</div></div>
          <div class="stat-cell"><div class="sv" id="snChances">0</div><div class="sl">🐍 游戏机会</div></div>
          <div class="stat-cell"><div class="sv" id="snBest">0</div><div class="sl">🏆 最高分</div></div>
        </div>
        <button class="btn btn-green" id="snRedeemBtn">🔄 兑换 1 次机会（-5 星星）</button>
        <div style="height:12px"></div>
        <button class="btn btn-gold" id="snStartBtn">🐍 开始游戏</button>
      </div>
    </section>

    <!-- 对局 -->
    <section id="snGame" class="hidden">
      <div class="sn-hud">
        <span id="snScore">🍎 0</span>
        <span id="snLen">🐍 3</span>
        <span id="snTimer">⏰ 10:00</span>
      </div>
      <div class="sn-stage">
        <canvas id="snCanvas"></canvas>
      </div>
      <div class="sn-pad">
        <button class="sn-pad-btn" id="snUp">▲</button>
        <button class="sn-pad-btn" id="snLeft">◀</button>
        <button class="sn-pad-btn" id="snDown">▼</button>
        <button class="sn-pad-btn" id="snRight">▶</button>
      </div>
    </section>

    <!-- 结算 -->
    <section id="snOver" class="hidden sn-over">
      <div class="sn-over-box">
        <div class="sn-over-title" id="snOverTitle">🐍 游戏结束</div>
        <div class="sn-over-line">🍎 吃到苹果：<b id="snOverScore">0</b></div>
        <div class="sn-over-line">🏆 历史最高：<b id="snOverBest">0</b></div>
        <button class="btn btn-gold" id="snAgainBtn">🔄 再来一局</button>
        <button class="btn btn-ghost" id="snHomeBtn">🏠 回大厅</button>
      </div>
    </section>
  </div>

  <script src="js/common.js?v=65"></script>
  <script src="js/snake.js?v=65"></script>
</body>
</html>
