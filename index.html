<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="学习乐园">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FFB300">
  <title>学习乐园</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="page">
    <header class="home-header">
      <div>
        <div class="hello-title">你好，小凡！👋</div>
        <div class="hello-date" id="todayLabel"></div>
      </div>
      <div class="streak-badge" id="streakBadge">🔥 连续 0 天</div>
    </header>

    <section class="stars-row">
      <div class="stars-total" data-star-key="total">⭐ 0</div>
      <button class="btn-checkin" id="checkinBtn">📅 今天打卡 +4⭐</button>
    </section>

    <main class="subject-grid">
      <a class="subject-card sc-yuwen" href="yuwen.html">
        <div class="sc-emoji">📖</div>
        <div class="sc-name">语文</div>
        <div class="sc-desc">古诗 · 生字 · 阅读</div>
        <div class="sc-stars" data-star-key="yuwen">⭐ 0</div>
      </a>
      <a class="subject-card sc-shuxue" href="kousuan.html">
        <div class="sc-emoji">🔢</div>
        <div class="sc-name">数学</div>
        <div class="sc-desc">口算 · 竖式 · 应用</div>
        <div class="sc-stars" data-star-key="shuxue">⭐ 0</div>
      </a>
      <a class="subject-card sc-yingyu" href="yingyu.html">
        <div class="sc-emoji">🔤</div>
        <div class="sc-name">英语</div>
        <div class="sc-desc">单词卡 · 小测验</div>
        <div class="sc-stars" data-star-key="yingyu">⭐ 0</div>
      </a>
      <a class="subject-card sc-kexue" href="kexue.html">
        <div class="sc-emoji">🔬</div>
        <div class="sc-name">科学</div>
        <div class="sc-desc">科普阅读 · 问答</div>
        <div class="sc-stars" data-star-key="kexue">⭐ 0</div>
      </a>
    </main>

    <a class="game-card" href="doudizhu.html">
      <div class="gc-left">
        <div class="gc-emoji">🃏</div>
        <div>
          <div class="gc-name">斗地主</div>
          <div class="gc-desc">完成作业赚星星，5 颗星换一局</div>
        </div>
      </div>
      <div class="gc-right">
        <div class="gc-jifen" data-balance-key>⭐ 0 星星</div>
        <div class="gc-chances" data-chances-key>🎮 机会 0</div>
        <div class="gc-go">去玩 ▶</div>
      </div>
    </a>

    <a class="game-card gc-mc" href="minecraft.html">
      <div class="gc-left">
        <div class="gc-emoji">⛏️</div>
        <div>
          <div class="gc-name">我的世界</div>
          <div class="gc-desc">自由建造，10 颗星换一局</div>
        </div>
      </div>
      <div class="gc-right">
        <div class="gc-jifen" data-balance-key>⭐ 0 星星</div>
        <div class="gc-chances" data-mc-chances-key>⛏️ 机会 0</div>
        <div class="gc-go">去玩 ▶</div>
      </div>
    </a>

    <a class="game-card gc-fj" href="feiji.html">
      <div class="gc-left">
        <div class="gc-emoji">✈️</div>
        <div>
          <div class="gc-name">飞机大战</div>
          <div class="gc-desc">打敌机赚金币，10 颗星换一局</div>
        </div>
      </div>
      <div class="gc-right">
        <div class="gc-jifen" data-balance-key>⭐ 0 星星</div>
        <div class="gc-chances" data-feiji-chances-key>✈️ 机会 0</div>
        <div class="gc-go">去玩 ▶</div>
      </div>
    </a>

    <a class="game-card gc-pool" href="pool.html">
      <div class="gc-left">
        <div class="gc-emoji">🎱</div>
        <div>
          <div class="gc-name">台球</div>
          <div class="gc-desc">买球杆打台球，好杆瞄准线更长</div>
        </div>
      </div>
      <div class="gc-right">
        <div class="gc-jifen" data-balance-key>⭐ 0 星星</div>
        <div class="gc-chances">🎱 进商店</div>
        <div class="gc-go">去玩 ▶</div>
      </div>
    </a>

    <a class="parent-link" href="parent.html">👨‍👩‍👧 家长空间</a>
  </div>

  <script src="js/common.js?v=3"></script>
  <script src="js/home.js?v=3"></script>
</body>
</html>
