<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="小牛排">
  <meta name="format-detection" content="telephone=no">
  <title>小牛排 · i同步学</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=82">
</head>
<body class="tangbao-page" data-store="niupai">
  <div class="page tangbao-page">

    <div class="tb-open" id="storeOpen">
      <div class="tb-curtain tb-curtain-left"></div>
      <div class="tb-curtain tb-curtain-right"></div>
      <div class="tb-open-box">
        <div class="tb-sign" id="storeOpenSign">🥩 小牛排</div>
        <div class="tb-open-desc">接单 → 煎牛排 → 加酱汁 → 装盘 → 端给客人</div>
        <button class="tb-open-btn" id="storeOpenBtn">🏮 开始营业</button>
      </div>
    </div>

    <div class="tb-closed hidden" id="storeClosed">
      <div class="tb-closed-box">
        <div class="tb-closed-emoji">🌙</div>
        <div class="tb-closed-title">今日打烊</div>
        <div class="tb-closed-score" id="storeClosedScore"></div>
        <div class="tb-closed-next" id="storeClosedNext"></div>
        <button class="tb-open-btn" id="storeClosedBtn">🏪 回美食大厨</button>
      </div>
    </div>

    <div class="tb-top">
      <a class="back" href="foodchef.html" aria-label="返回美食大厨">←</a>
      <div class="tb-sign-mini" id="storeSign">🥩 小牛排</div>
      <div class="tb-score" id="storeScoreBox">🪙 <span id="storeScoreNum">0</span></div>
    </div>

    <div class="tb-daily" id="storeDaily">👥 今日 0 / 10</div>
    <div class="tb-combo" id="storeCombo"></div>

    <div class="tb-stage">
      <div class="tb-kitchen">
        <div class="tb-work">
          <div class="tb-hint" id="storeHint">👨‍🍳 客人来了，快开始做吧！</div>
          <div class="tb-work-area" id="storeWorkArea"></div>
        </div>
        <div class="tb-queue-title">🧑‍🤝‍🧑 排队等餐</div>
        <div class="tb-queue" id="storeQueue"></div>
      </div>
    </div>

    <div class="tb-bottom">
      <button class="tb-btn" id="btn1">🍳<span>煎牛排</span></button>
      <button class="tb-btn" id="btn2">🫗<span>加酱汁</span></button>
      <button class="tb-btn" id="btn3">🍽️<span>装盘</span></button>
    </div>
  </div>

  <script src="js/common.js?v=82"></script>
  <script src="js/storecook.js?v=82"></script>
</body>
</html>
