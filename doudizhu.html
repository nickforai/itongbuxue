<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="斗地主">
  <meta name="format-detection" content="telephone=no">
  <title>斗地主 · i同步学</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=83">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">←</a>
      <h1>🃏 斗地主</h1>
      <div class="star-pill" id="chancePill">🎮 0</div>
      <div class="star-pill" id="jifenPill">⭐ 0</div>
    </div>

    <!-- 大厅：星星与兑换 -->
    <section id="lobby">
      <div class="panel">
        <h2>🎮 游戏大厅</h2>
        <p style="color:var(--muted);font-size:.92rem;line-height:1.7;margin-bottom:14px">
          和小粉、小蓝两位好朋友打牌，<b>5 颗星星 = 1 次机会</b>。输赢都开心，不打紧！
        </p>
        <div class="stat-grid" style="margin-bottom:16px">
          <div class="stat-cell"><div class="sv" id="lobbyJifen">0</div><div class="sl">⭐ 星星</div></div>
          <div class="stat-cell"><div class="sv" id="lobbyChances">0</div><div class="sl">🎮 游戏机会</div></div>
        </div>
        <button class="btn btn-green" id="redeemBtn">🔄 兑换 1 次机会（-5 星星）</button>
        <div style="height:12px"></div>
        <button class="btn btn-gold" id="startBtn">🎮 开始游戏</button>
      </div>
      <div class="panel" style="color:var(--muted);font-size:.85rem;line-height:1.8">
        <b style="color:var(--ink)">儿童版规则</b><br>
        🎲 开局随机一人当地主，不用叫分<br>
        💡 不会出牌就点「提示」· 🤖 不想玩了点「托管」<br>
        💖 小粉温柔、小蓝憨憨，都会让着你，赢多输少！
      </div>
    </section>

    <!-- 对局 -->
    <section id="game" class="hidden">
      <div class="ddz-statusbar">
        <span id="ddzRole">🧑‍🌾 你是农民</span>
        <span id="ddzStatus">准备开始…</span>
        <span id="ddzTimer">⏰ 10:00</span>
      </div>
      <div class="ddz-bots">
        <div class="ddz-bot" id="bot1">
          <div class="bot-head">💖 小粉<span class="landlord-tag hidden" id="landlordTag1">👑地主</span></div>
          <div class="bot-cards" id="bot1Back"></div>
          <div class="bot-chat" id="bot1Chat"></div>
          <div class="bot-play" id="bot1Play"></div>
        </div>
        <div class="ddz-bot" id="bot2">
          <div class="bot-head">🤪 小蓝<span class="landlord-tag hidden" id="landlordTag2">👑地主</span></div>
          <div class="bot-cards" id="bot2Back"></div>
          <div class="bot-chat" id="bot2Chat"></div>
          <div class="bot-play" id="bot2Play"></div>
        </div>
      </div>

      <div class="ddz-center">
        <div class="ddz-bottom" id="bottomCards"></div>
        <div class="ddz-turn" id="ddzTurn"></div>
      </div>

      <div class="ddz-mine">
        <div class="ddz-my-play" id="myPlay"></div>
        <div class="ddz-hand" id="myHand"></div>
        <div class="ddz-actions" id="actionRow">
          <button class="btn btn-red btn-big" id="btnPass">要不起</button>
          <button class="btn btn-blue btn-big" id="btnHint">💡 提示</button>
        </div>
        <div class="ddz-actions">
          <button class="btn btn-green btn-big" id="btnPlay">出牌！</button>
          <button class="btn btn-gold btn-big" id="btnAuto">🤖 托管</button>
        </div>
      </div>

      <div class="panel ddz-history">
        <div class="hist-title">📜 出牌记录</div>
        <div class="hist-scroll" id="historyBox"></div>
      </div>
    </section>

    <!-- 结算 -->
    <section id="overlay" class="hidden">
      <div class="panel result-box">
        <div class="result-emoji" id="overEmoji"></div>
        <div class="result-score" id="overTitle"></div>
        <div class="result-line" id="overLine"></div>
        <button class="btn btn-gold" id="overAgain">🔄 再来一局</button>
        <div style="height:12px"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="overHome">🏠 回首页</button>
          <button class="btn btn-ghost" id="overLobby">🎮 游戏大厅</button>
        </div>
      </div>
    </section>

    <div class="ddz-fireworks hidden" id="fireworks"></div>
  </div>

  <script src="js/common.js?v=83"></script>
  <script src="js/doudizhu-core.js?v=39"></script>
  <script src="js/doudizhu.js?v=39"></script>
</body>
</html>
